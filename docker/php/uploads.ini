; Лимиты загрузки файлов (админка Filament: новости, файлы «Аттестации»).
; Держать в паре с:
;   - docker/nginx/default.conf  → client_max_body_size
;   - config/livewire.php        → temporary_file_upload.rules (max:51200)
;   - ->maxSize(51200) в Filament FileUpload

upload_max_filesize = 50M
post_max_size = 55M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
max_file_uploads = 20
